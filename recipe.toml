# The recipe's defaults. `cluster.toml` next to this file overrides them per cluster (copy cluster.example.toml),
# an environment variable of the same name in upper case overrides both (PORT=8001 python3 -m spark up).

[model]
# Mia's AI Lab's EXL3 quantization of GLM-5.3-Flash (4-bit "mcg" trellis for the routed experts, everything else
# BF16), served as published: the engine reads the trellises and scales where the checkpoint keeps them.
# ablit = false (the default) serves the published checkpoint, no account needed. ablit = true (cluster.toml, or
# ABLIT=1) serves the Ablit weights: the same checkpoint, abliterated by Mia's AI Lab (README,
# "Ablit weights"). The repository is gated: `spark up` needs a Hugging Face token (HF_TOKEN, or `hf auth login`)
# whose account was granted access on the model's page, and stops before the download with the steps otherwise.
# access on the model page); each checkpoint stays in the cache.
ablit = false
repo = "Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold-Ablit"
revision = "57edefd2f5d9b371c8345883304d5af68b52fa24"
published_repo = "Mia-AiLab/GLM-5.3-Flash-EXL3-4bpw-TensorFold"
published_revision = "76c0b5173166d2795dd48860f45d8224817f894c"
served_name = "GLM-5.3-Flash-EXL3"

[engine]
# TensorFold's native (Zig) engine at its latest release with this recipe's patch: our GLM-5.3-Flash family for two
# CUDA ranks (its own kernels, EXL3 routed experts, up to 16 streams in one batched step), built by
# docker/Dockerfile.native.
tensorfold_repo = "https://github.com/ashhart/TensorFold.git"
tensorfold_sha = "ffa85fd52fa55c76c9230e3f6189f3efd652de52"     # v1.0.11
patch = "tensorfold-native-v1.0.11-glm.patch"
# sha256 of docker/patches/<patch>; the image carries it as a label and `up` refuses a mismatch
patch_sha256 = "addfa5270e8fa28d962d08c6959e577e0b3cea2cea824654060bcb97d30b230e"
image = "tf-glm53-exl3:native-v1.0.11"
base_image = "nvcr.io/nvidia/pytorch:26.07-py3@sha256:2140e699b3beaf7f96a0081fd9c9406bc3832b435cdb60dfa2d261f7d2f34a1c"
container = "tf-glm53-exl3"

[cluster]
head_ip = "10.100.8.1"           # the head's address on the RoCE link (rank 1 rendezvous)
worker = "user@10.100.8.2"       # ssh login of the worker; rank 1 runs there
iface = "enp1s0f1np1"            # NCCL_SOCKET_IFNAME
hca = "rocep1s0f1"               # NCCL_IB_HCA (pin one; GB10 exposes dead HCAs too)
master_port = 29571
port = 8000
hf_cache = "~/.cache/huggingface"
tf_cache = "~/.cache/tensorfold-glm53-exl3"

[serve]
context = 1048576                # a request's window at most (the trained one); caches take ~13 KB a token a rank
parallel = 16                    # requests decoding at once; their caches share what the model leaves (a request waits for room)
drafts = true                    # drafts (replies equal undrafted); false serves without them
# who drafts. "dflash2" (the default): IncoAI's DFlash2 block drafter (huggingface.co/incoai/GLM-5.3-Flash-DFlash2),
# downloaded from IncoAI on first use and loaded as published. ITS WEIGHTS ARE CC BY-NC-ND 4.0: NON-COMMERCIAL USE
# ONLY (research and evaluation). For any commercial use set drafter = "mtp": the checkpoint's own MTP head, under the
# recipe's licences only (about 18% slower on code, as fast elsewhere).
drafter = "dflash2"
dflash2_repo = "incoai/GLM-5.3-Flash-DFlash2"
dflash2_revision = "bf582e4eacc1810f76656d1811693ff6c6737d2a"
dflash2_sha256 = "b038e1d9d1e7833fa3880c2c0135ba9b673013f03da1b29fb831931584759dac"   # model.safetensors
thinking = false
max_tokens = 32768
tool_system = "Tool calls: include only the arguments the user explicitly provided or clearly implied. Never fill in optional arguments with default or guessed values. When a request asks for several things, make one call for each of them."
memory_reserve_gib = 12          # host headroom the engine leaves beside the pool (the pool still holds a 1M request: ~13.3 GiB)
dense_bits = 4                   # dense linears packed at load (symmetric, a scale per 64): 4 (the measured default), 6 (8% slower, quality not measured on this checkpoint), 8, 0 keeps bf16
head_bits = 8                    # the head the replies are verified with
draft_head_bits = 4              # the copy MTP drafts read (they only propose); 0: the head itself
vision = true                    # the vision tower (1 GB, rank 0): images and videos in chat messages
extra_args = ""
extra_env = "TF_ROCE_MAX_KB=4096 TF_GLM_WINDOW=8"   # one-shot RoCE gathers up to 4 MiB: 8 streams' partial sums (1 MiB) and 16-row windows (4 MiB) stay off NCCL; 512 cost 24-43% at 8 streams (2026-10-13)
settle_seconds = 30              # wait after a stop before a rank starts (NCCL's first ibv_reg_mr on the worker)
memguard = true
memguard_min_avail_mb = 3072
memguard_min_swap_free_mb = 2048
